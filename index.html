<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визитка — Создаю сайты</title>
    <style>
        /* Подключение твоего шрифта */
        @font-face {
            font-family: 'Rita';
            src: url('fonts/Cornerita-VF.ttf') format('truetype');
        }

        /* Общие стили */
        body {
            background-color: hsl(120, 100%, 95%);
            margin: 0;
            padding: 20px;
        }

        /* Картинка */
        img {
            width: 700px;
            height: 400px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
        }

        /* Заголовок */
        h1 {
            font-family: 'Rita', Courier, monospace;
            color: rgba(0, 0, 0, 0.527);
            font-size: 60px;
            text-align: center;
            margin-top: 20px;
        }

        /* Абзац */
        p {
            font-family: 'Courier New', Courier, monospace;
            color: rgb(87, 83, 83);
            text-align: center;
            font-size: 20px;
            text-indent: 0; /* убираем отступ, он не нужен для центрированного текста */
        }
    </style>
</head>
<body>
    <img src="images/icon_racoon.jpg" alt="Иконка енота">
    <h1>Создаю сайты</h1>
    <p>Я могу создать ваш сайт по одному из шаблонов, представленных ниже:</p>
</body>
</html>
